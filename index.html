<script id="app-logic">
/*
  Backend: Google Apps Script gratuito (ver google-apps-script/ruleta-greenville-backend.gs
  en el repo). Guarda el estado compartido para que cualquiera pueda girar la ruleta
  desde su celular SIN iniciar sesión en ningún lado. Rellenar BACKEND_URL con la URL
  "/exec" que entrega el despliegue como Web App ("Cualquier usuario" con acceso).
*/
const BACKEND_URL = 'https://script.google.com/macros/s/AKfycby1Pw7nOUYPd6IAQciqaJrehkfyDLJQOuMmoeJRWLeEKRCgRZ29zFPiR1buF_3Nx_zjTg/exec';

const PAGE_CSS = `
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap');

:root{
  --green:#14a83d;
  --green-deep:#0b6b28;
  --green-light:#5ecb7c;
  --green-tint:#e7f8ec;
  --navy:#1e4a8a;
  --navy-deep:#0d2547;
  --navy-light:#3d6bb5;
  --navy-tint:#e8eef9;
  --sky:#2fa9d6;
  --sky-deep:#1c7fa8;
  --sky-tint:#e7f6fb;
  --ink:#132338;
  --muted:#5b6b7d;
  --surface:#ffffff;
  --surface-alt:#f2f9f4;
  --line:#dceee1;
  --alert:#d64545;
  --shadow:rgba(13,37,71,0.16);
}
*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
body{
  background:var(--surface-alt);
  background-image:
    radial-gradient(circle at 8% 4%, rgba(20,168,61,0.08), transparent 42%),
    radial-gradient(circle at 96% 14%, rgba(47,169,214,0.10), transparent 38%),
    repeating-linear-gradient(135deg, rgba(13,37,71,0.025) 0 2px, transparent 2px 26px);
  color:var(--ink);
  font-family:'Nunito', 'Segoe UI', Arial, sans-serif;
  -webkit-font-smoothing:antialiased;
}
h1,h2{ font-family:'Baloo 2', 'Arial Rounded MT Bold', sans-serif; font-weight:700; text-wrap:balance; margin:0; }
a{ color:var(--navy); }
button{ font-family:inherit; }
::selection{ background:var(--green); color:#fff; }
:focus-visible{ outline:3px solid var(--sky); outline-offset:2px; }
@media (prefers-reduced-motion:reduce){ *{ animation-duration:0.001ms !important; transition-duration:0.001ms !important; } }

.wrap{ max-width:760px; margin:0 auto; padding:0 18px 64px; }

.top-banner{
  background:var(--navy-deep); color:#fff; border-radius:14px;
  padding:11px 16px; font-size:0.9rem; margin:16px 0;
  display:flex; gap:10px; align-items:center; box-shadow:0 4px 14px -6px var(--shadow);
}
.top-banner.readonly{ background:var(--alert); }

header.masthead{
  position:relative; max-width:760px; margin:0 auto; overflow:hidden;
  border-radius:0 0 32px 32px; box-shadow:0 16px 36px -18px var(--shadow);
}
.hero-band{
  position:relative; padding:22px 24px 44px;
  background:
    radial-gradient(circle at 15% -10%, rgba(255,255,255,0.16), transparent 55%),
    linear-gradient(120deg, var(--green-deep) 0%, var(--navy-deep) 78%);
  display:flex; flex-direction:column; align-items:center; gap:16px;
}
.gear-btn{
  position:absolute; top:16px; right:16px; z-index:2; width:42px; height:42px; border-radius:50%;
  border:none; background:rgba(255,255,255,0.92); cursor:pointer; font-size:1.1rem;
  display:flex; align-items:center; justify-content:center; box-shadow:0 4px 10px -3px rgba(0,0,0,0.4);
  transition:transform .15s ease;
}
.gear-btn:hover{ transform:rotate(25deg); }
.brand-badge{
  background:#fff; border-radius:999px; padding:8px 22px; box-shadow:0 8px 18px -8px rgba(0,0,0,0.5);
}
.brand-logo{ height:44px; width:auto; display:block; }
.mascot-row{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; justify-content:center; }
.mascot-img{
  height:118px; width:auto; border-radius:20px; border:4px solid #fff;
  box-shadow:0 10px 22px -8px rgba(0,0,0,0.55); background:#fff;
}
.mascot-bubble{
  position:relative; background:#fff; border-radius:16px;
  padding:10px 16px; font-family:'Baloo 2', sans-serif; font-size:1.05rem; color:var(--navy-deep);
  max-width:200px; text-align:left; box-shadow:0 8px 16px -8px rgba(0,0,0,0.4);
  display:flex; align-items:center; gap:8px;
}
.mascot-bubble svg{ flex-shrink:0; }
.mascot-bubble::before{
  content:''; position:absolute; left:-10px; top:50%; transform:translateY(-50%);
  border-top:8px solid transparent; border-bottom:8px solid transparent; border-right:11px solid #fff;
}
.masthead-body{
  background:var(--surface); text-align:center; padding:20px 24px 26px; margin-top:-26px;
  border-radius:26px 26px 0 0; position:relative; z-index:1;
}
.eyebrow{
  font-family:'Nunito', sans-serif; text-transform:uppercase; letter-spacing:0.14em; font-weight:800;
  font-size:0.72rem; color:var(--green-deep); display:flex; align-items:center; justify-content:center; gap:8px;
}
.eyebrow .dot{ width:6px; height:6px; border-radius:50%; background:var(--sky); }
h1.event-name{ font-size:clamp(1.9rem,6vw,2.6rem); color:var(--navy-deep); margin-top:8px; min-height:1.2em; }
p.event-subtitle{ color:var(--muted); font-size:1rem; margin-top:6px; max-width:48ch; margin-left:auto; margin-right:auto; min-height:1.4em; }

section.stub{
  position:relative; background:var(--surface); border-radius:22px; box-shadow:0 10px 26px -18px var(--shadow);
  padding:28px 24px; margin-top:20px; overflow:hidden;
}
section.stub::before{
  content:''; position:absolute; top:0; left:0; right:0; height:5px;
  background:linear-gradient(90deg, var(--green) 0%, var(--sky) 50%, var(--navy) 100%);
}

.identity-row{ display:flex; flex-wrap:wrap; gap:14px; align-items:flex-end; }
.identity-field{ flex:1 1 260px; }
.identity-field label{ display:block; font-size:0.8rem; font-weight:800; text-transform:uppercase; letter-spacing:0.06em; color:var(--muted); margin-bottom:6px; }
.identity-field input[type="text"]{
  width:100%; padding:13px 15px; border-radius:14px; border:2.5px solid var(--line);
  background:var(--surface-alt); font-size:1.08rem; color:var(--ink); font-family:'Nunito', sans-serif; font-weight:700;
}
.identity-field input[type="text"]:focus{ border-color:var(--sky); }
.identity-field.shake{ animation:shake .38s; }
@keyframes shake{ 10%,90%{transform:translateX(-2px)} 20%,80%{transform:translateX(4px)} 30%,50%,70%{transform:translateX(-8px)} 40%,60%{transform:translateX(8px)} }
.identity-hint{ font-size:0.82rem; color:var(--muted); margin-top:7px; }
.identity-hint.warn{ color:var(--alert); font-weight:800; }

.wheel-section{ text-align:center; }
.section-title{ font-size:1.35rem; color:var(--navy-deep); }
.section-desc{ color:var(--muted); font-size:0.95rem; margin-top:4px; margin-bottom:18px; }

.celebrate-card{
  position:relative; overflow:hidden; text-align:center; border-radius:22px; padding:26px 20px 22px;
  margin-bottom:20px; color:#fff;
  background:linear-gradient(160deg, var(--rb-color, var(--green)) 0%, var(--ink) 145%);
  box-shadow:0 14px 30px -12px var(--shadow);
}
.celebrate-card .confetti{ position:absolute; top:0; left:0; width:100%; height:40px; }
.celebrate-icon{
  position:relative; z-index:1; width:64px; height:64px; border-radius:50%;
  background:rgba(255,255,255,0.22); display:flex; align-items:center; justify-content:center; margin:0 auto 12px;
  box-shadow:inset 0 0 0 2px rgba(255,255,255,0.35);
}
.celebrate-title{ position:relative; z-index:1; font-family:'Baloo 2', sans-serif; font-size:1.35rem; margin:0; text-wrap:balance; }
.celebrate-sub{ position:relative; z-index:1; font-size:1rem; margin-top:6px; opacity:0.92; }
.celebrate-saving{ position:relative; z-index:1; margin-top:10px; font-size:0.85rem; display:inline-flex; gap:8px; align-items:center; opacity:0.9; }
.mini-spinner{ width:14px; height:14px; border-radius:50%; border:2px solid #fff; border-top-color:transparent; display:inline-block; animation:spin 0.7s linear infinite; }
@keyframes spin{ to{ transform:rotate(360deg); } }

.wheel-shell{ position:relative; width:min(300px,80vw); margin:6px auto 24px; filter:drop-shadow(0 18px 24px var(--shadow)); }
.wheel-pointer{
  position:absolute; top:-10px; left:50%; transform:translateX(-50%); z-index:2;
  width:34px; height:40px;
}
.wheel-svg{ width:100%; height:auto; display:block; transform:rotate(0deg); }
.wheel-svg.spinning{ transition:transform 4.2s cubic-bezier(.17,.67,.1,.99); }
.wheel-label{ font-family:'Baloo 2', sans-serif; font-size:15px; fill:#ffffff; font-weight:700; }

.spin-btn{
  font-family:'Baloo 2', sans-serif; letter-spacing:0.02em; font-size:1.2rem; color:#fff;
  background:linear-gradient(135deg, var(--green-light), var(--green)); border:none; border-radius:999px; padding:17px 38px;
  cursor:pointer; box-shadow:0 8px 0 var(--green-deep), 0 14px 22px -10px var(--shadow); transition:transform .1s ease, box-shadow .1s ease;
  display:inline-flex; align-items:center; gap:10px;

function confettiOverlay(){

  return `<svg class="confetti" viewBox="0 0 300 40" preserveAspectRatio="none" aria-hidden="true">${shapes}</svg>`;
}

function escapeHtml(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function cloneState(s){ return JSON.parse(JSON.stringify(s)); }
function formatWhen(iso){
  if (!iso) return '';
  try {
    const d = new Date(iso);
    const sameDay = d.toDateString() === new Date().toDateString();
    const time = d.toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' });
    return sameDay ? `hoy ${time}` : `${d.toLocaleDateString('es-MX', { day: '2-digit', month: 'short' })} ${time}`;
  } catch(e) { return ''; }
}
function saveLocalState(s){ try { localStorage.setItem('teamRaffleLocalState', JSON.stringify(s)); } catch(e) {} }

function findAssignment(name){
  const n = (name || '').trim().toLowerCase();
  if (!n) return null;
  for (const a of state.areas) {
    if ((a.members || []).some(m => m.trim().toLowerCase() === n)) return a;
  }
  return null;
}

function polar(cx, cy, r, angleDeg){
  const rad = angleDeg * Math.PI / 180;
  return [cx + r * Math.sin(rad), cy - r * Math.cos(rad)];
}

function computeSegments(areas){
  const weights = areas.map(a => 1 / ((a.members ? a.members.length : 0) + 1));
  const total = weights.reduce((s, w) => s + w, 0);
  let acc = 0;
  return areas.map((a, i) => {
    const angle = weights[i] / total * 360;
    const seg = { id: a.id, start: acc, end: acc + angle };
    acc += angle;
    return seg;
  });
}

function pickIndexByWeight(segments){
  const r = Math.random() * segments[segments.length - 1].end;
  for (let i = 0; i < segments.length; i++) {
    if (r < segments[i].end) return i;
  }
  return segments.length - 1;
}

function buildWheelSVG(areas){
  const segments = computeSegments(areas);
  const cx = 150, cy = 150, r = 140;
  let paths = '', labels = '';
  segments.forEach((seg, i) => {
    const a = areas[i];
    const color = COLOR_BY_ID[a.id] || '#14a83d';
    const [x1, y1] = polar(cx, cy, r, seg.start);
    const [x2, y2] = polar(cx, cy, r, seg.end);
    const large = (seg.end - seg.start) > 180 ? 1 : 0;
    paths += `<path d="M ${cx} ${cy} L ${x1.toFixed(2)} ${y1.toFixed(2)} A ${r} ${r} 0 ${large} 1 ${x2.toFixed(2)} ${y2.toFixed(2)} Z" fill="${color}" stroke="#ffffff" stroke-width="4"/>`;
    const mid = (seg.start + seg.end) / 2;
    const [lx, ly] = polar(cx, cy, r * 0.6, mid);
    const flip = (mid > 90 && mid < 270) ? 180 : 0;
    labels += `<text x="${lx.toFixed(2)}" y="${ly.toFixed(2)}" transform="rotate(${(mid + flip).toFixed(2)} ${lx.toFixed(2)} ${ly.toFixed(2)})" class="wheel-label" text-anchor="middle" dominant-baseline="middle">${escapeHtml(a.name)}</text>`;
  });
  return `<svg viewBox="0 0 300 300" class="wheel-svg" id="wheel-rotor" role="img" aria-label="Ruleta de equipos">
    <defs>
      <radialGradient id="hubGrad" cx="35%" cy="30%" r="75%">
        <stop offset="0%" stop-color="#ffffff"/>
        <stop offset="100%" stop-color="#dfe9f2"/>
      </radialGradient>
    </defs>
    <circle cx="150" cy="150" r="148" fill="#ffffff"/>
    <circle cx="150" cy="150" r="146" fill="none" stroke="#0d2547" stroke-width="4"/>
    ${paths}
    <circle cx="150" cy="150" r="146" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.5"/>
    <circle cx="150" cy="150" r="24" fill="url(#hubGrad)" stroke="#0d2547" stroke-width="4"/>
    ${labels}
  </svg>`;
}

function buildPointerSVG(){
  return `<svg viewBox="0 0 34 40" class="wheel-pointer" aria-hidden="true">
    <path d="M17 40 L2 14 A15 15 0 1 1 32 14 Z" fill="#0d2547" stroke="#ffffff" stroke-width="2.5"/>
    <circle cx="17" cy="14" r="6" fill="#ffffff"/>
  </svg>`;
}

  const nameInput = document.getElementById('name-input');
  if (nameInput) {
    nameInput.addEventListener('input', () => {
      myName = nameInput.value;
      try { localStorage.setItem('teamRaffleName', myName); } catch(e) {}
      if (myName.trim()) nameWarn = false;
    });
  }

  if (pendingSpinDeg !== null) {
    const rotor = document.getElementById('wheel-rotor');
    if (rotor) {
      let settled = false;
      const settle = () => { if (settled) return; settled = true; onSpinEnd(); };
      rotor.getBoundingClientRect();
      requestAnimationFrame(() => {
        rotor.classList.add('spinning');
        rotor.style.transform = `rotate(${pendingSpinDeg}deg)`;
      });
      rotor.addEventListener('transitionend', settle, { once: true });
      setTimeout(settle, 4600);
    } else {
      onSpinEnd();
    }
  }
}

function showToast(msg){
  const host = document.getElementById('toast-host');
  if (!host) return;
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  host.appendChild(el);
  setTimeout(() => el.remove(), 4200);
}

function flagNameMissing(){
  nameWarn = true;
  render();
  const el = document.getElementById('name-input');
  if (el) el.focus();
}

let jsonpSeq = 0;
function jsonpRequest(url){
  return new Promise((resolve, reject) => {
    const cbName = '__ruletaCb' + (jsonpSeq++) + '_' + Date.now();
    const script = document.createElement('script');
    let settled = false;
    const timer = setTimeout(() => {
      if (settled) return;
      settled = true;
      cleanup();
      reject(new Error('timeout'));
    }, 10000);
    function cleanup(){
      delete window[cbName];
      if (script.parentNode) script.parentNode.removeChild(script);
      clearTimeout(timer);
    }
    window[cbName] = (data) => {
      if (settled) return;
      settled = true;
      cleanup();
      resolve(data);
    };
    script.onerror = () => {
      if (settled) return;
      settled = true;
      cleanup();
      reject(new Error('script_error'));
    };
    const sep = url.indexOf('?') === -1 ? '?' : '&';
    script.src = url + sep + 'callback=' + cbName;
    document.head.appendChild(script);
  });
}

async function callBackend(payload){
  const params = new URLSearchParams();
  const { action, ...rest } = payload;
  params.set('action', action);
  if (Object.keys(rest).length) params.set('payload', JSON.stringify(rest));
  return jsonpRequest(BACKEND_URL + '?' + params.toString());
}

async function loadFromBackend(){
  if (!BACKEND_URL) return;
  try {
    const data = await jsonpRequest(BACKEND_URL);
    if (data && data.ok && data.state) {
      backendOk = true;
      state = data.state;
    } else {
      backendOk = false;
    }
  } catch (err) {
    backendOk = false;
  }
}

async function sendAction(payload, successMsg){
  isBusy = true;
  render();
  if (!BACKEND_URL) {
    // Modo demo local sin backend configurado todavía.
    isBusy = false;
    return { ok: true, demo: true };
  }
  try {
    const data = await callBackend(payload);
    backendOk = true;
    if (data.state) state = data.state;
    isBusy = false;
    if (data.ok) {
      if (successMsg) { render(); showToast(successMsg); } else { render(); }
      return { ok: true };
    }
    render();
    return { ok: false, error: data.error };
  } catch (err) {
    backendOk = false;
    isBusy = false;
    render();
    showToast('No se pudo conectar. Revisa tu conexión e intenta de nuevo.');
    return { ok: false, error: 'network' };
  }
}

async function assign(areaId){
  const name = myName.trim();
  if (!BACKEND_URL) {
    // Demo local: aplica el cambio directamente en memoria/localStorage.
    const area = state.areas.find(a => a.id === areaId);
    if (!area || isAreaFull(area)) { isSpinning = false; render(); return; }
    const newState = cloneState(state);
    const na = newState.areas.find(a => a.id === areaId);
    na.members = [...(na.members || []), name];
    const now = new Date().toISOString();
    newState.log = [...(newState.log || []), { areaId, areaName: area.name, personName: name, at: now }];
    resultBanner = { areaId, areaName: area.name, personName: name };
    state = newState;
    saveLocalState(state);
    isSpinning = false;
    render();
    setTimeout(() => { resultBanner = null; render(); }, 4500);
    return;
  }
  const area = state.areas.find(a => a.id === areaId);
  const areaName = area ? area.name : areaId;
  resultBanner = { areaId, areaName, personName: name };
  render();
  const result = await sendAction({ action: 'assign', areaId, name });
  isSpinning = false;
  if (result.ok) {
    setTimeout(() => { resultBanner = null; render(); }, 4500);
  } else {
    resultBanner = null;
    if (result.error === 'already_assigned') {
      showToast('Ya estás en un equipo — no puedes girar dos veces.');
    } else if (result.error === 'area_full') {
      showToast('Justo se llenó ese equipo — gira de nuevo.');
    }
    render();
  }
}

function onSpinEnd(){
  spinLock = false;
  const target = pendingSpinTarget;
  pendingSpinTarget = null;
  pendingSpinDeg = null;
  if (target) assign(target);
}

function spinWheel(){
  if (isBusy || isSpinning || spinLock) return;
  const name = myName.trim();
  if (!name) { flagNameMissing(); return; }
  const existing = findAssignment(name);
  if (existing) { showToast(`Ya estás en el equipo de ${existing.name}`); render(); return; }
  const open = availableAreas(state.areas);
  if (open.length === 0) { showToast('El sorteo ya se completó — no quedan lugares.'); render(); return; }
  const segments = computeSegments(open);
  const idx = pickIndexByWeight(segments);
  const seg = segments[idx];
  const mid = (seg.start + seg.end) / 2;
  const jitter = (Math.random() - 0.5) * (seg.end - seg.start) * 0.5;
  const deg = 360 * 7 - (mid + jitter);
  isSpinning = true;
  pendingSpinTarget = open[idx].id;
  pendingSpinDeg = deg;
  render();
  spinLock = true;
}

async function saveEventInfo(){
  const nameEl = document.getElementById('ev-name');
  const subEl = document.getElementById('ev-sub');
  const eventName = (nameEl?.value || '').trim() || 'Ruleta Greenville';
  const eventSubtitle = (subEl?.value || '').trim();
  if (!BACKEND_URL) {
    state = { ...state, eventName, eventSubtitle };
    saveLocalState(state);
    render();
    showToast('Datos del evento actualizados.');
    return;
  }
  await sendAction({ action: 'updateInfo', eventName, eventSubtitle }, 'Datos del evento actualizados.');
}

async function saveTeamNames(){
  const names = {};
  state.areas.forEach(a => {
    const el = document.getElementById('team-' + a.id);
    if (el && el.value.trim()) names[a.id] = el.value.trim();
  });
  if (!BACKEND_URL) {
    const newState = cloneState(state);
    newState.areas.forEach(a => { if (names[a.id]) a.name = names[a.id]; });
    state = newState;
    saveLocalState(state);
    render();
    showToast('Nombres de equipo actualizados.');
    return;
  }
  await sendAction({ action: 'renameTeams', names }, 'Nombres de equipo actualizados.');
}

async function resetAll(){
  if (!resetConfirming) {
    resetConfirming = true;
    render();
    setTimeout(() => { if (resetConfirming) { resetConfirming = false; render(); } }, 4000);
    return;
  }
  resetConfirming = false;
  if (!BACKEND_URL) {
    const newState = cloneState(state);
    newState.log = [];
    newState.areas = newState.areas.map(a => ({ ...a, members: [] }));
    state = newState;
    saveLocalState(state);
    render();
    showToast('El sorteo se reinició. ¡A empezar de nuevo!');
    return;
  }
  await sendAction({ action: 'reset' }, 'El sorteo se reinició. ¡A empezar de nuevo!');
}

function copyLink(){
  navigator.clipboard.writeText(SHARE_URL)
    .then(() => showToast('¡Enlace copiado! Pégalo en el chat de WhatsApp 📋'))
    .catch(() => showToast('No se pudo copiar. Copia el enlace desde la barra de direcciones.'));
}

document.addEventListener('click', (ev) => {
  const overlay = ev.target.closest('[data-action="overlay-close"]');
  if (overlay && !ev.target.closest('[data-stop]')) {
    settingsOpen = false;
    resetConfirming = false;
    render();
    return;
  }
  const btn = ev.target.closest('[data-action]');
  if (!btn) return;
  const action = btn.dataset.action;
  if (action === 'toggle-settings') { settingsOpen = !settingsOpen; resetConfirming = false; render(); }
  else if (action === 'spin') spinWheel();
  else if (action === 'copy-link') copyLink();
  else if (action === 'save-event-info') saveEventInfo();
  else if (action === 'save-team-names') saveTeamNames();
  else if (action === 'reset-all') resetAll();
});

function pollTick(){
  if (spinLock || isBusy || isSpinning || settingsOpen) return;
  const active = document.activeElement;
  if (active && active.id === 'name-input') return;
  if (document.hidden) return;
  loadFromBackend().then(() => render());
}

(function init(){
  if (!BACKEND_URL) {
    const saved = loadLocalState();
    if (saved) state = saved;
    render();
    return;
  }
  render();
  loadFromBackend().then(render);
  setInterval(pollTick, 6000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) pollTick(); });
})();
</script>
